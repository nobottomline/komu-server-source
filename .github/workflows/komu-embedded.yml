name: Komu embedded server

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: komu-embedded-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'nobottomline/komu-server'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Pin archive epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Test and verify embedded artifact
        run: ./gradlew :server:test :server:verifyEmbeddedJava17Artifact --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: embedded-test-reports
          path: server/build/reports/tests/test/
          if-no-files-found: ignore
